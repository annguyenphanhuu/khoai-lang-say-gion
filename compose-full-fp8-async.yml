# CANDIDATE D — 63.38 config (v0.22.1 Full-FP8) + ONE new flag: --async-scheduling.
# Mechanism: overlap the serial CPU work per decode step (scheduler.schedule(),
# output processing) with GPU model exec -> step time ~ max(GPU,CPU) instead of
# GPU+CPU. At this workload's low batch (1-4), the ~1.4ms CPU overhead is the last
# soft part of TPOT (weights already FP8-floored). If hidden -> TPOT ~3.4->~2.2ms.
# Attacks TPOT, which has ~7.4 pt/ms gradient -> the realistic path to 70.
# Local (v0.25.1-cu129, BF16): flag accepted, boots WITH cudagraph, output correct.
# Same image/digest as 63.38 -> only variable is the flag.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --async-scheduling
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
