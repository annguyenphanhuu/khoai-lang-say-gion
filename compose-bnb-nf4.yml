# ============================================================================
# WORKSTREAM B (4-bit weight) — BnB NF4 online. Đường 4-bit ÍT-CODE nhất. 1 BIẾN vs cpu-lean.
# ============================================================================
# BIẾN DUY NHẤT vs compose-cpu-lean.yml: --quantization fp8  ->  --quantization bitsandbytes
#   (bitsandbytes tự set load-format; KHÔNG cần patch, KHÔNG cần checkpoint pre-quant).
#
# HỢP LỆ LUẬT "online only": BnB quantize BF16 gốc -> NF4 NGAY LÚC LOAD (inflight). Loader vLLM
#   0.22.1 hard-code quant_type="nf4" cho đường online (bitsandbytes_loader.py:437/678/687) ⇒
#   dùng NF4 (chính xác hơn int4/fp4: đo local rel~0.11 int4 vs ~kỳ vọng thấp hơn cho nf4).
#   bnb đã cài trong image (0.49.2); LFM2 có packed_modules_mapping ⇒ loader hỗ trợ; min-cap 70 (Hopper OK).
#
# CƠ CHẾ ĂN ĐIỂM: linear dùng `matmul_4bit` FUSED (đọc 4-bit từ HBM, KHÔNG materialize full bf16)
#   ⇒ giảm byte weight/token ~1B→0.5B ⇒ TPOT có thể ~2.7ms (đường duy nhất vượt 71).
#
# ⚠️ RỦI RO CHÍNH (chỉ portal chốt được — local không có Hopper để test):
#   1. TỐC ĐỘ: kernel BnB KHÔNG tối ưu Hopper như Marlin/CUTLASS. Bandwidth giảm là chắc, nhưng
#      overhead kernel có thể bù trừ. Nếu TPOT KHÔNG giảm ⇒ chuyển sang patch Marlin-FP4 (image-w4a8/).
#   2. CUDA GRAPH: nếu BnB không capture được graph ⇒ decode rơi về eager ⇒ CPU overhead quay lại
#      ⇒ TPOT có thể TỆ hơn. Đây là rủi ro lớn nhất. NẾU tbt tăng vọt ⇒ nguyên nhân này.
#   3. ACCURACY: NF4 ~8-11% weight-error. accuracy_drop đọc từ portal (gate đã cho thấy khoan dung).
#
# ĐỌC KẾT QUẢ: nhìn tbt_median (TPOT) + accuracy_drop + failed_count.
#   - tbt giảm (~2.5-3.0) & accuracy_drop nhỏ ⇒ THẮNG, tiến ~74 (rồi stack right-size/TTFT).
#   - tbt ~4-6 hoặc tăng ⇒ kernel/eager nuốt lợi ích ⇒ bỏ BnB, dùng Marlin-FP4 custom.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=bitsandbytes   # <<< BIẾN DUY NHẤT (was fp8); tự set load-format=bitsandbytes, inflight NF4
      - --disable-log-stats
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
