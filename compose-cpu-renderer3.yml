# WAVE6-F2 — `--renderer-num-workers=3`. MỘT cờ trên đúng image 63.38.
#
# CƠ CHẾ: renderer pool (mặc định **1 thread**) lo chat-template Jinja2 + tokenize cho
# MỌI request đến. Workload này: turn 6 có context ~4700 token (~20K ký tự) phải render
# template + encode — nằm TRÊN đường tới first-token và chạy TUẦN TỰ 1 thread cho cả 70
# hội thoại. Tokenizer là Rust và NHẢ GIL ⇒ tăng worker cho song song thật.
# Docstring vLLM: "Number of worker threads in the renderer thread pool ... to parallelize
# tokenization, chat template rendering ... across concurrent requests."
#
# VÌ SAO ĐÁNG: TTFT p50 = 55ms nhưng compute prefill của 5/6 request (150 tok mới, prefix
# cache hit) chỉ ~1–3ms ⇒ ~40–50ms là hàng đợi/host-CPU. Đây là ứng viên số 1 cùng F1.
# 3 worker = đúng số core MiG (3).
#
# FALSIFY: ttft_p50 không giảm ⇒ render/tokenize không phải nút cổ chai ⇒ đóng hướng này,
# dồn sang F3 (frontend HTTP/SSE) hoặc patch EngineCore.
# LƯU Ý: "renderer workers" từng thử ở KỲ CŨ (nền 61, gói chung nhiều biến) — lần này
# chạy ĐƠN BIẾN trên nền 63.38 và có cơ chế định lượng, không phải thử lại mù.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --renderer-num-workers=3
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
