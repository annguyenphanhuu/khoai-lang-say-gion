# ============================================================================
# WORKSTREAM B — Online W4A8 (int4-g128 + FP8 act) qua CutlassW4A8LinearKernel.
#   Đường DUY NHẤT vượt 64.67 (hạ TPOT ~3.8→~2.7). Kernel nhanh (CUDA-graph), KHÔNG như BnB (15ms).
# ============================================================================
# ⚠️ IMAGE: build từ image-w4a8/Dockerfile rồi PIN digest @sha256 sau push (thay dòng image bên dưới).
#   docker build -f image-w4a8/Dockerfile -t <YOU>/vllm-w4a8:online-r1 image-w4a8/ && docker push ...
#
# BIẾN vs compose-cpu-lean.yml: --quantization fp8 -> online_w4a8 (+ image mới). gpu-mem 0.95->0.90
#   (headroom cho transient BF16→packed lúc load). max-len giữ 32768 (tránh failed như rightsize 6144).
#
# ⚠️ RỦI RO (chỉ portal chốt — không test được local: cần Hopper cap90 + CUDA13):
#   - Đã verify LOCAL (CPU): syntax, import, register method, RTN+pack round-trip khớp định dạng kernel,
#     chữ ký constructor param. ⇒ image build + boot-registration OK.
#   - CHƯA verify: kernel CUTLASS runtime (process_weights + cutlass_w4a8_mm) — chỉ chạy trên Hopper.
#     Patch fail-loud (assert) ⇒ nếu lỗi, log portal chỉ đúng dòng. Đây là lý do GIỮ submit #2 để sửa.
#   - Accuracy: int4-g128 ~11% weight-err; NHƯNG BnB NF4 4-bit đã cho accuracy_drop=0 ⇒ gate khoan dung.
#
# ĐỌC KẾT QUẢ: tbt_median (kỳ vọng ~2.5-3.0) + accuracy_drop (kỳ vọng nhỏ) + failed_count.
#   tbt~2.7 & acc nhỏ → ~74 → stack TTFT tiếp. tbt cao/boot fail → đọc log, sửa, dùng submit #2.
services:
  model:
    image: annguyenphanhuu/vllm-w4a8:online-r1@sha256:afa562d714e185cc345a9143a762a59a8288c8147a10fe1b60e1fe3d191332b0
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=online_w4a8   # <<< custom online int4-g128 + fp8 act (image-w4a8)
      - --disable-log-stats
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
