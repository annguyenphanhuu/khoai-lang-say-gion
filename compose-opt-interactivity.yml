# CANDIDATE P2a — `--performance-mode=interactivity` (1 BIẾN trên nền BEST 64.67).
#
# Biến DUY NHẤT so với compose-cpu-lean.yml = thêm --performance-mode=interactivity.
#
# CƠ CHẾ (đã verify source v0.22.1, vllm.py:1682):
#   - balanced (default): capture graph size [1,2,4] + bội số 8 (8,16,24,32...).
#     ⇒ batch 3 pad lên graph-4, batch 5-7 lên 8, batch 9-15 lên 16 → chạy dư compute.
#   - interactivity: capture MỌI size 1..min(max,32) → bỏ padding ở small batch.
#   Flag hợp lệ: arg_utils.py:1493 add_argument("--performance-mode").
#
# ĐIỀU KIỆN THẮNG: chỉ có gain nếu histogram batch decode thật rơi vào 3..~15 (padding-bound)
#   VÀ đang GPU-bound-không-bão-core. Nếu batch≈1-2 → NULL (path batch-1 không đổi).
#   ⇒ Submit này ĐỒNG THỜI là phép đo histogram: tăng → batch padding-bound; phẳng → batch≈1-2.
#
# WATCH: interactivity capture ~32 graph (nhiều hơn balanced ~7). Ở gpu-mem-util=0.95 có thể
#   ép KV/OOM → failed request. NẾU failed>0: hạ gpu-memory-utilization xuống 0.90 rồi chạy lại.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --disable-log-stats
      - --performance-mode=interactivity
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
