# ============================================================================
# DIAG-NOCACHE — **phép đo, KHÔNG phải đòn ăn điểm.** Chờ điểm rất thấp. Đó là đúng.
# 1 BIẾN vs `compose-k4.yml`: `--no-enable-prefix-caching`.
# ============================================================================
# ĐO CÁI GÌ: TTFT của portal là **prefill (GPU)** hay **frontend (CPU/tokenizer)**.
#
# Đây là ẩn số cuối cùng chặn đường tới 80: 80 đòi TPOT ≤ 2.75 **VÀ** ttft ≤ ~20–25
# (xem PLAN §5). Nếu ttft chủ yếu là prefill GPU thì trục TTFT gần như bất động và
# đòn "cache tokenization" chỉ đáng ~+2 ERS thay vì ~+7.
#
# CƠ CHẾ: prefix-cache đang ăn 2586/2872 token ⇒ chỉ 286 token được prefill thật.
# Tắt cache ⇒ prefill 2872 token (×10). Δttft = 2586 × (chi phí prefill / token).
#
#   | ttft_p50 đo được | Kết luận | Việc 28–29/07 |
#   | :-- | :-- | :-- |
#   | **≳ 350 ms** | prefill ~0.15 ms/token ⇒ **ttft hiện tại ~80% là prefill GPU** | bỏ tokenization-cache; dồn 100% vào attention |
#   | **~100–150 ms** | prefill rẻ ⇒ **ttft hiện tại chủ yếu là frontend CPU** | làm tokenization-cache (~+7 ERS) |
#   | 150–350 ms | chia đôi | làm attention trước, tokenization-cache nếu còn giờ |
#
#   Chỉ cần đọc **`ttft_p50_ms`** — trường này luôn được trả kể cả khi `failed > 10`,
#   nên phép đo vẫn hợp lệ dù điểm sập. KHÔNG cần bóc TPOT ở bài này.
#
# AN TOÀN: prefix caching chỉ là cache, tắt đi **không đổi output** (output-preserving).
#   Không đụng cudagraph. VRAM giảm áp lực chứ không tăng.
#   ⚠️ Chờ `failed_count` cao và ERS ~25–55. Best-of ⇒ không mất gì.
# ============================================================================
services:
  model:
    image: annguyenphanhuu/vllm-w4a8:online-r3@sha256:2ba9c346bd48c2c6e3084769b2697f6eed753687127d26ef299deadb95677703
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --no-enable-prefix-caching   # <<< BIẾN DUY NHẤT
      - --quantization=online_w4a8
      - --disable-log-stats
      - --disable-uvicorn-access-log
      - --renderer-num-workers=2
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
