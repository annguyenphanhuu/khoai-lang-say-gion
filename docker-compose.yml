# BÀI CHÍNH — best ĐÃ KIỂM CHỨNG PORTAL: 63.38 (2026-07-22, Wave1-A).
# = v0.22.1 + patch Full-FP8 (mở rộng FP8 sang ShortConv proj + LM head) + prefix caching.
# TTFT ~50/75ms, TBT 4ms, accuracy_drop 0. Image pin digest bất biến (hậu kiểm).
# LƯU Ý: KHÔNG thêm mnbt8192 (đã đo −4.19 trên Full-FP8) và KHÔNG thêm --async-scheduling
# (Wave2 = null). Chi tiết: on-tap/07. Fallback an toàn không-custom-image: xem git history.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
