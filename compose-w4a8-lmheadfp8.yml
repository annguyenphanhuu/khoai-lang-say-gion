# ============================================================================
# K3 — W4A8 (65.06) + lm_head FP8.  1 BIẾN duy nhất vs compose-w4a8.yml: IMAGE.
#   online-r1 -> online-r3: OnlineW4A8Config.get_quant_method giờ trả Fp8LinearMethod
#   cho ParallelLMHead (trước đó trả None -> lm_head rơi về BF16).
#   Mọi flag/command GIỮ NGUYÊN 100% so với compose-w4a8.yml.
# ============================================================================
# LÝ THUYẾT (STRATEGY.md §1, mô hình byte/step đã fit 3/3 điểm portal, sai số ~5%):
#   lm_head 65536x2048 = 134M param: BF16 268MB/step -> FP8 134MB/step = -134MB
#   TPOT: (0.80-0.134+1.09)GB / 0.6TB/s ~ 3.15 -> 2.93 ms  ⇒ ERS ~65 -> ~72
#
# RỦI RO THẤP — đường code này ĐÃ CHẠY THẬT: compose-cpu-lean.yml (64.67, 0 failed)
#   dùng đúng Fp8LinearMethod trên ParallelLMHead qua patch_full_fp8.py trong CÙNG base image.
#   K3 chỉ nối lại đường đó khi --quantization=online_w4a8. VRAM +134MB (embed BF16 vẫn giữ)
#   -> gpu-memory-utilization giữ 0.90, còn headroom.
#
# ĐÃ VERIFY LOCAL (CPU, không cần GPU):
#   - syntax + register online_w4a8 OK
#   - fp8.py trong base image CÓ dispatch (LinearBase, ParallelLMHead)  [gate mới trong validate_build.py]
#   - OnlineW4A8Config()._fp8().get_name() == "fp8"
#   CHƯA verify: runtime Hopper (cutlass w4a8 + fp8 lm_head cùng lúc) -> portal chốt.
#
# ĐỌC KẾT QUẢ: so ERS với 65.06 (KHÔNG so tbt — portal làm tròn số nguyên).
#   ERS ~70-73 => đúng mô hình, đi tiếp K2 (KV 8-bit).  ERS ~65 => lm_head không vào FP8, đọc log boot.
services:
  model:
    image: annguyenphanhuu/vllm-w4a8:online-r3@sha256:2ba9c346bd48c2c6e3084769b2697f6eed753687127d26ef299deadb95677703
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.90
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=online_w4a8   # <<< int4-g128 body + FP8 act + [K3] FP8 lm_head
      - --disable-log-stats
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
