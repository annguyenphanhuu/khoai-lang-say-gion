# CÔNG CỤ P1 (CHỈ dùng khi log chứng minh baseline BỊ NARROW về PIECEWISE).
#
# KHÔNG phải candidate mặc định. Nếu bench/verify_cudagraph.sh / log cho thấy cudagraph_mode
# đã là FULL_AND_PIECEWISE ở image best ⇒ ĐÓNG file này (no-op).
#
# Chỉ ÉP LẠI mode, KHÔNG hard-code capture_sizes: default vLLM (balanced) đã capture
# [1,2,4]+bội-số-8 tới 256; ép [1,2,4,8] sẽ CẮT coverage và fallback khi batch thực >8
# (bài học từ opt80 cũ). Để capture sizes theo default; nếu muốn giảm padding small-batch,
# dùng --performance-mode=interactivity (xem compose-opt-interactivity.yml) thay vì hard-code.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --disable-log-stats
      - '--compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE"}'
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
