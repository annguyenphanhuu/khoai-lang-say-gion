# ============================================================================
# WORKSTREAM A (LOSSLESS) — right-size max-model-len. 1 BIẾN trên BEST 64.67.
# ============================================================================
# BIẾN DUY NHẤT vs compose-cpu-lean.yml: --max-model-len 32768 -> 6144.
#
# CƠ SỞ (grading-workload-spec.json): context tối đa ~4400 tok (turn 6: sys1000+conv1000+
#   6×150 user + 5×300 out) + 300 out = ~4700. 6144 dư an toàn. 32768 THỪA 6–7×.
#
# CƠ CHẾ ĂN ĐIỂM (lossless, không đổi output ⇒ không rủi ro Accuracy Gate):
#   - max-model-len nhỏ ⇒ mỗi sequence reserve ÍT KV block hơn ⇒ CÙNG VRAM chứa được NHIỀU
#     block hơn cho **prefix cache**. Workload này prefix-cache-nặng (shared 1000 + per-conv
#     1000, hit 419+ lần) ⇒ nhiều cache block = hit-rate cao hơn = prefill mới ít hơn = **TTFT giảm**.
#   - block table / cudagraph metadata nhỏ hơn ⇒ overhead scheduler giảm nhẹ.
#
# KỲ VỌNG: TTFT 45→~35–40 (vài điểm), TPOT ~không đổi (vẫn weight-bound). Downside chặn ở ~64.7.
# WATCH: nếu có request vượt 6144 → failed. Đã tính dư (4700 < 6144). Nếu failed>0: nâng 8192.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=6144        # <<< BIẾN DUY NHẤT (was 32768)
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --disable-log-stats
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
