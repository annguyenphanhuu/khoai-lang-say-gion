# DIAGNOSTIC (không phải bài thi) — tách GPU-compute vs CPU/launch cho tbt 3ms.
# 1 BIẾN vs compose-cpu-lean.yml: + --enforce-eager (tắt CUDA graph).
#   tbt nhảy vọt   -> nhạy CPU/launch (branch B) -> cắt được bằng engine (P3).
#   tbt ~không đổi -> GPU-compute-bound (branch A) -> 3ms là compute GPU, gần sàn cứng.
# Điểm sẽ THẤP (eager chậm) — giá trị là DELTA tbt vs cpu-lean, KHÔNG phải điểm.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --disable-log-stats
      - --enforce-eager        # <<< BIẾN DUY NHẤT
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
