# WAVE6-F4 — "vệ sinh CPU host": `--disable-log-stats` + giới hạn thread. Image 63.38.
#
# CƠ CHẾ: MiG chỉ có **3 core CPU / 8GB RAM**. Hai nguồn lãng phí có thật:
#  (a) `log_stats=True` (mặc định) ⇒ EngineCore dựng & đẩy SchedulerStats/IterationStats
#      MỖI step (per-request loop) rồi logger in throughput định kỳ — thuần Python, nằm
#      trong đúng vòng lặp mà ta đo được là 0.17ms/token.
#  (b) torch/OpenMP mặc định mở thread theo số core ⇒ 3 core bị tranh chấp giữa
#      EngineCore, API server và thread pool trong lúc prepare_inputs/detokenize.
#      `OMP_NUM_THREADS=1` + `MKL_NUM_THREADS=1` bỏ oversubscription.
#
# Đây là bài GỘP 2 biến (có chủ ý): cả hai đều là "cắt CPU rác", không có cơ chế nào
# khiến chúng triệt tiêu nhau. Nếu thắng, vòng sau tách biến để biết cái nào ăn.
#
# FALSIFY: không đổi ⇒ stats/thread không đáng kể ⇒ 0.17ms/token nằm ở phần LÕI
# (detokenize + dựng output + ZMQ + SSE) ⇒ chỉ patch code mới cắt được.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --disable-log-stats
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
