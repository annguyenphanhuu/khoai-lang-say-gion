# ============================================================================
# P1 PROBE — điểm ĐO A (FP8, ~1.0 byte/param). Cặp với `compose-p1-bf16.yml`.
# ============================================================================
# MỤC ĐÍCH: đo SLOPE của TPOT theo số byte/param của weight, để CHỐT xem
#   W4A8 (P5) có đáng build hay không. Đây là DIAGNOSTIC, KHÔNG phải candidate submit.
#
# File này = bản sao Y HỆT `compose-cpu-lean.yml` (BEST 64.67, TBT≈3.8ms) — dùng làm
#   điểm FP8 chạy LẠI cùng thời điểm với bản BF16 để ΔTBT miễn nhiễm portal-drift.
#   BIẾN DUY NHẤT so với `compose-p1-bf16.yml` = dòng `--quantization=fp8` (có ở đây, bỏ ở kia).
#
# CÁCH ĐỌC KẾT QUẢ + CÔNG THỨC QUYẾT ĐỊNH: xem đầy đủ trong header của `compose-p1-bf16.yml`.
#   Tóm tắt: TBT(FP8) là điểm b=1.0; TBT(BF16) là điểm b=2.0. W4A8 ≈ b=0.5.
#   Dự đoán W4A8_TBT ≈ 5.7 − 0.5·TBT(BF16)  (giả định TBT(FP8)≈3.8; tuyến tính, BỎ QUA dequant).
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8          # <<< BIẾN DUY NHẤT: có ở đây, BỎ ở compose-p1-bf16.yml
      - --disable-log-stats
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
