# NEXT-80 Bước 0+1 — SPECULATIVE DECODING (n-gram / prompt-lookup) trên vLLM 0.25.1.
# ⚑ THAY THẾ compose-opt-ngram.yml (file đó pin nhầm image fastsse 0.22.1). Đường spec BẮT BUỘC
#   build từ 0.25.1 (HANDOFF §rig, luật 3). Image dưới = baseline Full-FP8 v0.25.1 đã có sẵn.
#
# ============ VÌ SAO ĐÂY LÀ ĐÒN 80 ============
# tbt=3ms = op-floor GPU (mọi quant/fusion/CPU đã cạn — HANDOFF). Cách DUY NHẤT hạ tbt mà
# không đổi model = sinh NHIỀU token / 1 target-forward:  effective_tbt = forward / accept_len.
#   accept_len 2 ⇒ tbt 3→1.5ms ⇒ s_tpot 0.60→0.89 ⇒ ~+14đ (~79).
#   accept_len 3 ⇒ tbt→1.0ms ⇒ s_tpot~0.95 ⇒ ~82.
# n-gram/prompt-lookup RẺ (không train): đề xuất K token bằng match n-gram trong context.
# Workload "restate document / numbered checklist" copy nhiều từ context 2000+ tok ⇒ hit cao.
#
# ============ CỔNG BẮT BUỘC (2 gate, theo thứ tự) ============
#  G0 correctness (Bước 0): bench/correctness_diff.py temp=0 vs baseline fp8 PHẢI PASS.
#     Lệch 1 token ⇒ bug rollback conv-state hybrid (vLLM #39273) ⇒ trượt Accuracy Gate ⇒ DỪNG.
#     Greedy spec ĐÚNG là LOSSLESS ⇒ FAIL = bug impl, KHÔNG nộp.
#  G1 acceptance (Bước 1): bench/spec_accept_probe.py mean_accept_len ≥ ~1.5 VÀ net tbt < control.
#     Chỉ nộp khi cả G0+G1 pass, rồi build image 0.25.1 + đo THẬT trên portal.
#
# ⚠️ Đây là config DEV/TEST trên rig — chưa nộp. Portal bóp BW ⇒ tbt tuyệt đối khác, nhưng
#   ACCEPTANCE + CORRECTNESS đo trên rig transfer THẲNG sang portal (NEXT-80 §4).
#
# SWEEP: đổi num_speculative_tokens (3–6) & prompt_lookup_min/max rồi đo lại acceptance.
#   prompt_lookup_max cao quét sâu hơn (nhận chuỗi copy dài) nhưng verify tốn hơn nếu miss.
services:
  model:
    image: annguyenphanhuu/vllm-fullfp8-v0251:r1@sha256:3c753c5c3c4696ea6efab6249980e262c9ad5ed0b3bbee318d55a829c42da41e
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.225   # rig H100 80GB ≈ portal MiG 18GB. (Full-H100 dùng 0.95.)
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --disable-log-stats
      # spec-config hợp nhất (vLLM ≥0.24). prompt_lookup_* quét CẢ context 2000-tok (shared+conv prefix).
      - '--speculative-config={"method":"ngram","num_speculative_tokens":4,"prompt_lookup_min":2,"prompt_lookup_max":8}'
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
