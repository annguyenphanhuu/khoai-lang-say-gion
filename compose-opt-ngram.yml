# ⛔ DEPRECATED (2026-07-25) — file này pin image fastsse 0.22.1 (SAI cho đường spec).
#    Dùng `compose-spec-ngram-v0251.yml` (baseline 0.25.1) + `on-tap/RUNBOOK-SPEC-80.md`.
#    Giữ lại chỉ để tham chiếu lịch sử cú pháp --speculative-config.
#
# ROADMAP ④ — SPECULATIVE DECODING (n-gram) — TEST ONLY, CHƯA ĐƯỢC SUBMIT.
#
# ⚠️ CỔNG BẮT BUỘC TRƯỚC KHI SUBMIT: bench/correctness_diff.py (temp=0) so với image best
#   64.67. LỆCH 1 token ⇒ bug rollback conv-state của vLLM cho hybrid (vLLM issue #39273) ⇒
#   DỪNG, trượt Accuracy Gate. Chỉ submit nếu PASS + acceptance (spec_accept_probe.py) > ~1.5.
#
# CƠ CHẾ: n-gram/prompt-lookup đề xuất K token bằng match n-gram trong context. Workload
#   "restate document / numbered checklist" copy nhiều từ context ⇒ acceptance có thể tốt.
#   Chấp nhận k token/step ⇒ chia nhỏ chi phí đọc weight ⇒ PHÁ memory floor ⇒ TPOT giảm mạnh
#   (đường DUY NHẤT vượt trần ~79).
#
# RỦI RO: (1) correctness — xem cổng trên. (2) draft/verify thêm CPU trên 3 core yếu có thể
#   ăn hết lợi ích ở batch≈1 ⇒ đo TPOT thực, đừng tin lý thuyết.
#
# LƯU Ý version: --speculative-config (JSON hợp nhất) ở vLLM mới; version cũ dùng
#   --speculative-model/--num-speculative-tokens. Xác nhận `vllm serve --help | grep -i spec`.
services:
  model:
    image: annguyenphanhuu/vllm-fastsse:fullfp8-20260721-r1@sha256:32273a6e86725f9efb241c715cfd3b4bd202665380d72ce8e09c5810f74cc4da
    entrypoint:
      - python3 #Don't change this to vllm-server
      - -m #Don't change this to vllm-server
      - vllm.entrypoints.openai.api_server #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=32768
      - --gpu-memory-utilization=0.95
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --quantization=fp8
      - --disable-log-stats
      - '--speculative-config={"method":"ngram","num_speculative_tokens":4,"prompt_lookup_max":3,"prompt_lookup_min":1}'
    environment:
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - VLLM_LOGGING_LEVEL=WARNING
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
